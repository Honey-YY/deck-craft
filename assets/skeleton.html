<!DOCTYPE html>
<html lang="zh-CN" data-theme="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="layouts.css">
</head>
<body>

<div class="stage">
<div class="deck" id="deck">

  <!-- 1 · 封面 -->
  <section class="slide cover on">
    <div class="bg-img"></div>
    <div class="mask"></div>
    <div class="slice"></div>
    <svg class="rays" width="1920" height="1080" viewBox="0 0 1920 1080">
      <line x1="1180" y1="0" x2="830" y2="1080" stroke="#9e57fa" stroke-width="8"/>
      <line x1="1220" y1="0" x2="870" y2="1080" stroke="rgba(158,87,250,.35)" stroke-width="3"/>
      <line x1="1260" y1="0" x2="910" y2="1080" stroke="rgba(158,87,250,.15)" stroke-width="2"/>
      <circle cx="1180" cy="0" r="10" fill="#9e57fa"/>
      <circle cx="830" cy="1080" r="10" fill="#9e57fa"/>
    </svg>
    <div class="brand"><div class="mark"></div><div class="name">{{BRAND}}</div></div>
    <div class="tag"><div class="sq"></div><div class="txt">{{EYEBROW}}</div></div>
    <h1>{{H1}}</h1>
    <div class="rule"><div class="l"></div><div class="d"></div><div class="s"></div></div>
    <div class="sub-en">{{SUBEN}}</div>
    <div class="sub-cn">{{LEAD}}</div>
    <div class="reporter"><div class="sq"></div><div class="txt">WRITER / <b>{{BRAND}}</b></div></div>
    <div class="desc">{{DESC}}</div>
    <div class="date"><div class="k">DATE</div><div class="d"></div><div class="v">{{DATE}}</div></div>
    <div class="mark3"><div class="a">THINK · WRITE · CUT</div><div class="b">想清楚 · 写出来 · 删干净</div></div>
  </section>

  <!--
    加页就复制 assets/deck.html 里对应版式的那一整段 <section>，改文字。
    可用版式：cover / agenda / section / bullets / columns / cards / stat
              chart / timeline / quote / table / image / process / end
    每页要有：class="slide 版式名"、<div class="pageno"> 页码。
    只有第一页带 on —— 其余不要写 on。
    一页至少 8 个视觉层次，对照 references/design-moves.md。
  -->

</div>
</div>

<div class="progress" id="progress"></div>
<div class="hud">
  <button id="prev" title="上一页 ←">←</button>
  <span class="count" id="count">1 / 1</span>
  <button id="next" title="下一页 →">→</button>
  <button id="full" title="全屏 F">⛶</button>
</div>

<script src="player.js"></script>
</body>
</html>
